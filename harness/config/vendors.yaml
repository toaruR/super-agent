# §4 ベンダーの抽象化宣言。新ベンダー追加はこのファイルへの宣言のみ（G1/C3）。
# 全フラグは実測（EVIDENCE A-1〜A-6）に基づく。
#
# ロール別既定（ベンダー選択＋モデル＋effort）はこのファイルの単一ソース。
# cli は --vendor/--reviewer が未指定のとき、ここから解決する。
roles:
  design:    { vendor: claude, model: claude-sonnet-5, effort: high }
  implement: { vendor: agy,   model: gemini-3.6-flash, effort: high }
  review:    { vendor: codex,  model: gpt-5.5,         effort: high }

claude:
  model_flag: "--model"
  effort_style: "flag"
  effort_flag: "--effort"
  headless:  ["claude", "-p", "{prompt}"]
  structured:
    flag: "--json-schema"
    form: inline            # 実測: claude はスキーマをインライン文字列で受ける（A-5）
  session:
    id_origin: caller       # ★呼び側が UUID を採番し --session-id で渡す（A-1）
    resume_flag: ["--resume"]
  permission:
    readonly:
      - "--allowedTools"
      - "Read,Grep,Glob"    # 読取専用（実行は防げない→A-6）
  brief_mode: path          # 簡報はファイルパス渡し（§5.6）

codex:
  model_flag: "-m"
  effort_style: "config"
  effort_key: "model_reasoning_effort"
  headless:  ["codex", "exec", "{prompt}"]
  structured:
    flag: "--output-schema"
    form: file              # 実測: codex はスキーマをファイルパスで受ける（A-5）
  session:
    id_origin: callee       # ★codex が採番しハンドルを返す（A-1）
    resume_flag: ["--resume"]
    # A-2: codex exec resume は -s を受け付けない。再開時は権限を毎回再宣言。
    # sandbox read-only は permission.readonly が付与するのでここでは full-auto のみ。
    resume_extra: ["--full-auto"]
  permission:
    readonly:
      - "--sandbox"
      - "read-only"         # 書込のみ阻止・実行は防げない（A-6）
  brief_mode: path

agy:
  model_flag: "--model"
  effort_style: "model_suffix"
  headless:  ["agy", "{prompt}"]
  structured:
    flag: "--json-schema"
    form: inline
  session:
    id_origin: callee       # agy は試験不足（E-2a のみ）。callee 仮定
    resume_flag: ["--resume-session-id"]
  permission:
    readonly:
      - "--mode"
      - "plan"
      - "--add-dir"
      - "{worktree}"        # ★最適解: 実行阻止 + 読取可（PERMISSION_CONTROL §7.4）
  brief_mode: path

hermes:
  model_flag: "-m"
  effort_style: "flag"
  effort_flag: "--reasoning"
  headless:  ["hermes", "chat", "-q", "{prompt}", "-Q"]
  # hermes に構造化出力フラグはない。schema は prompt 内指示とし、
  # extract_result が出力の最後の JSON 行を拾う（result_path 省略→全体）。
  # structured キーは意図的に省略（build_command でガード済み）。
  session:
    id_origin: callee       # hermes が session_id: 行を出力（--resume で再開）
    resume_flag: ["--resume"]
  permission:
    readonly:
      - "--safe-mode"       # 純粋な read-only フラグはない→全カスタマイズ無効で自壊を防ぐ
  # 実測(2026-08-07): --safe-mode は「書き込み禁止」ではない。headless(-Q) で
  # ファイル作成が実行された。よって read-only の担保は harness 側の worktree
  # 隔離（レビュー結果は本流へ書き戻さない）に依存する。claude/codex 同様
  # 「実行は防げない」(A-6) が hermes でも確認済み。
  brief_mode: path
