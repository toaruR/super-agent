# §4 ベンダーの抽象化宣言。新ベンダー追加はこのファイルへの宣言のみ（G1/C3）。
# 全フラグは実測（EVIDENCE A-1〜A-6）に基づく。
#
# ロール別既定（ベンダー選択＋モデル＋effort）はこのファイルの単一ソース。
# cli は --vendor/--reviewer が未指定のとき、ここから解決する。
# 任意で `timeout: <秒>` も各ロール（implement はチャンネルごと）に指定でき、
# vendorサブプロセスの待ち時間（既定 DEFAULT_TIMEOUT=1800秒）を上書きできる。
# 例: design: { vendor: claude, model: claude-sonnet-5, effort: high, timeout: 3600 }
roles:
  design:    { vendor: claude, model: claude-sonnet-5,  effort: high }
  planner:   { vendor: claude, model: claude-sonnet-5,  effort: high }   # 実行中の再計画（design と同一 vendor/skill だが別責務） 
  # design:    { vendor: agy,    model: gemini-3.6-flash, effort: high }
  # planner:   { vendor: agy,    model: gemini-3.6-flash, effort: high }
  # implement はチャンネルリスト（Stage B 並列(b) のマルチチャンネル実装）。
  # 各エントリが1チャンネル = 独立 worktree で並列実行。チャンネル数 = リスト長。
  # model/effort はチャンネルごとに指定可。単一辞書 {vendor,model,effort} も後方互換。
  #
  # 【既定は投機的実装「なし」】デフォルトの drive は、このリストから「1チャンネル」
  # だけを選んで各タスクを実装する（競わせない）。独立タスクは自動でタスクレベル並行
  # 処理される。投機的実装（複数チャンネルが同じタスクを競わせ、最初に review を通した
  # 勝者を統合）は非デフォルトのモードで、--speculative フラグを付けたときのみ有効。
  # その際はこのリスト全体が fan-out される（agy×2 + hermes×3 = 5チャンネル）。
  implement:
    - { vendor: claude, model: claude-sonnet-5,  effort: high }
    - { vendor: claude, model: claude-sonnet-5,  effort: high }
    - { vendor: claude, model: claude-sonnet-5,  effort: high }
    - { vendor: claude, model: claude-sonnet-5,  effort: high }
    - { vendor: claude, model: claude-sonnet-5,  effort: high }
    # - { vendor: hermes, model: hy3:Free,         effort: high }
    # - { vendor: hermes, model: hy3:Free,         effort: high }
    # - { vendor: hermes, model: hy3:Free,         effort: high }
    # - { vendor: hermes, model: hy3:Free,         effort: high }
    # - { vendor: hermes, model: hy3:Free,         effort: high }
    # - { vendor: agy,    model: gemini-3.6-flash, effort: high }
    # - { vendor: agy,    model: gemini-3.6-flash, effort: high }
  # review:    { vendor: codex,  model: gpt-5.6-luna,    effort: high }   # codex v0.147.0 で gpt-5.6-luna が実測で通る（25倍安価: $0.20/$1.20 vs gpt-5.5 の $5/$30）
  # review:    { vendor: claude, model: claude-sonnet-5,  effort: high }
  # review:    { vendor: agy,    model: gemini-3.6-flash, effort: high }
  review:    { vendor: claude, model: claude-sonnet-5,  effort: high }

claude:
  model_flag: "--model"
  effort_style: "flag"
  effort_flag: "--effort"
  headless:  ["claude", "-p", "--verbose", "--output-format", "stream-json", "{prompt}"]
  # 非対話は -p 必須。--output-format stream-json は --verbose 併用必須（実測:
  # 単独だと `--output-format=stream-json requires --verbose` で失敗）。NDJSON
  # 各行は type フィールドを持ち、終端行 type:"result" が result に最終テキストを
  # 持つ（非ストリーミング --output-format json の envelope と同じ形）ので、
  # extract_result の「最後の { 始まり行」ヒューリスティックはそのまま動く。
  # --verbose により hook ライフサイクル等の未知 type も混じるが、
  # invoke.py 側は未知 type を無視して素通しする（liveness 検知のみに使う）。
  # 実測(A-7): claude は --json-schema を StructuredOutput ツール不在で拒否するため、
  # structured キーは持たず（hermes と同様）、prompt 内で JSON を指示し、
  # extract_result が result テキストから JSON を再抽出する。
  result_path: "result"     # envelope から result テキストを抽出
  session:
    id_origin: caller       # ★呼び側が UUID を採番し --session-id で渡す（A-1）
    resume_flag: ["--resume"]
  permission:
    readonly:
      - "--allowedTools"
      - "Read,Grep,Glob"    # 読取専用（実行は防げない→A-6）
  brief_mode: path          # 簡報はファイルパス渡し（§5.6）

codex:
  model_flag: "-m"
  effort_style: "config"
  effort_key: "model_reasoning_effort"
  # headless は v0.147.0 の実体を絶対パスで指定。
  # 背景: subprocess 経由で単に "codex" を呼ぶと nvm4w の codex.cmd が v0.138.0 を
  # 解決し gpt-5.6-luna が "newer version required" で弾かれる。対話シェル(PowerShell)では
  # .ps1 経由で v0.147.0 になるが、Python の subprocess は .CMD(v0.138) を拾うため。
  # よって node + codex.js の絶対パスを直接指定する（v0.147.0 確実）。
  headless:  ["C:/nvm4w/nodejs/node.exe", "C:/nvm4w/nodejs/node_modules/@openai/codex/bin/codex.js", "exec", "--json"]
  # --json で NDJSON liveness ストリームを得る（実測2026-08-11: thread.started →
  # turn.started → item.completed(agent_message) → turn.completed で正常終端、
  # モデル過負荷時は error → turn.failed）。--output-schema + prompt_stdin の
  # 併用も実測で問題なし（両方付けても正常に動く）。ただし codex の最終行は
  # turn.completed/turn.failed という「メタ情報」であり claude/agy と違って
  # 「答え」そのものではないため、invoke.py の _codex_reconstruct_text() が
  # item.completed(agent_message) の text を answer として再構成し、
  # extract_result はその再構成テキストに対して動く（NDJSON生ログ全体には
  # 動かさない）。
  # codex exec は --output-schema と長文プロンプトを組み合わせると引数プロンプトを無視し
  # stdin からの追加入力を待つ（実測: RC=1 "Reading additional input from stdin..."）。
  # よって prompt_stdin: true を立て、invoke.py がプロンプトを stdin 経由で渡す（input=prompt）。
  # headless には {prompt} を置かない（引数プロンプトは使わない）。
  # 他ベンダー(claude/agy/hermes)は引数からプロンプトを読むので stdin の input は無視される。
  prompt_stdin: true
  structured:
    flag: "--output-schema"
    form: file              # 実測: codex はスキーマをファイルパスで受ける（A-5）
  session:
    id_origin: callee       # ★codex が採番しハンドルを返す（A-1）
    resume_flag: ["--resume"]
    # A-2: codex exec resume は -s を受け付けない。再開時は権限を毎回再宣言。
    # sandbox read-only は permission.readonly が付与するのでここでは full-auto のみ。
    resume_extra: ["--full-auto"]
  permission:
    readonly:
      - "--sandbox"
      - "read-only"         # 書込のみ阻止・実行は防げない（A-6）
  brief_mode: path

agy:
  model_flag: "--model"
  effort_style: "model_suffix"
  headless:  ["agy", "--output-format", "stream-json", "--add-dir", "{worktree}", "--dangerously-skip-permissions", "--print", "{prompt}"]
  # 非対話は --print 必須（省略で対話待機→ハング）。
  # --add-dir {worktree}: worktree をワークスペースに加え、agy がそのディレクトリを認識できるようにする。
  # --dangerously-skip-permissions は --print の「前」に置く（後だと無視される実測）。
  # 重要: agy は cwd (=worktree) を無視し固定 scratch に書く。worktree 内に書かせるには
  # implementer.py がプロンプトに worktree の絶対パスを埋め込み、「その絶対パスに書け」と
  # 指示する必要がある（実測で確認: 絶対パス明示なら worktree 内に作成される）。--add-dir や
  # Set-Location だけでは cwd は認識されない。
  # 重要(フラグ順序): --output-format stream-json は --print より「前」に置くこと。
  # 実測: --print より後ろに置くと agy はプロンプトを無視し「--output-formatとは何か」と
  # いう的外れな一般論を返す。--print より前なら NDJSON（event フィールド、終端
  # event:"result" → result.response に最終テキスト）が正しく返る。
  # 注意: 以前は `--output-format json`（非ストリーミング）を付けると agy --print が
  # 「構造化出力の説明モード」に入り実ファイル作成をしなくなる問題があったが、
  # stream-json ではこの問題は再現しない（実測）。
  result_path: "result.response"  # envelope から response テキストを抽出
  # response は文字列で、その中にモデルが指示された JSON を埋め込んで返す
  # （プロンプト内で JSON 指示する運用は変更なし）。extract_result の
  # _apply_result_path が文字列内の JSON/フェンスをさらに再抽出する
  # （claude の result_path="result" と同じ仕組み）。structured ブロックは
  # 意図的に持たない（--json-schema は --output-format json 必須で、
  # stream-json とは併用不可）。
  session:
    id_origin: callee       # agy は試験不足（E-2a のみ）。callee 仮定
    resume_flag: ["--resume-session-id"]
  permission:
    readonly: []
      # agy CLI は --allowedTools や --sandbox を持たず、--mode plan も対話型Planningモードを
      # 起動してしまうため、read-only フラグは空とする。プロンプト内の指示で読み取り専用を担保する。
  brief_mode: path

hermes:
  model_flag: "-m"
  effort_style: "flag"
  effort_flag: "--reasoning"
  # 実測(2026-08-07): --reasoning の実効は hy3:free では観測できず。NONE/HIGH で
  # 同一問いへの回答が変わらず、--reasoning bogus でもエラーにならず通る（値検証が
  # 緩い、またはモデル側で無視）。フラグを外すよりはマシだが「high が効いている証拠
  # はなし」。将来のモデル/CLI で効く可能性を残し削除はしない。
  headless:  ["hermes", "chat", "-q", "{prompt}", "-Q"]
  # hermes に構造化出力フラグはない。schema は prompt 内指示とし、
  # extract_result が出力の最後の JSON 行を拾う（result_path 省略→全体）。
  # structured キーは意図的に省略（build_command でガード済み）。
  session:
    id_origin: callee       # hermes が session_id: 行を出力（--resume で再開）
    resume_flag: ["--resume"]
  permission:
    readonly:
      - "--safe-mode"       # 純粋な read-only フラグはない→全カスタマイズ無効で自壊を防ぐ
  # 実測(2026-08-07): --safe-mode は「書き込み禁止」ではない。headless(-Q) で
  # ファイル作成が実行された。よって read-only の担保は harness 側の worktree
  # 隔離（レビュー結果は本流へ書き戻さない）に依存する。claude/codex 同様
  # 「実行は防げない」(A-6) が hermes でも確認済み。
  brief_mode: path
