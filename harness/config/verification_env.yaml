# §3.2 唯一の検証環境 (Canonical Verification Environment; CVE)
# テスト・ビルド・lint・実行はこの環境でのみ走る。
cve:
  id: "local-win-py311"
  shell: bash
  interpreters:
    # Windows git-bash は「C:/...」表記をそのまま解釈する。
    # このパスは実行環境ごとに書き換えること（ホストが変われば動かない）。
    python: "C:/Users/toaru/AppData/Local/hermes/hermes-agent/venv/Scripts/python.exe"
  probe:            # 起動時セルフチェック。ここが落ちたら全タスクを止める
    - ["C:/Users/toaru/AppData/Local/hermes/hermes-agent/venv/Scripts/python.exe", "-c", "import sys; print(sys.version)"]
    - ["git", "--version"]
