# §3.2 唯一の検証環境 (Canonical Verification Environment; CVE)
# テスト・ビルド・lint・実行はこの環境でのみ走る。
cve:
  id: "local-win-py311"
  shell: bash
  interpreters:
    # この環境で pytest が入っているのは .cve-venv。ホストが変われば書き換えが必要。
    # （Windows git-bash は「C:/...」表記をそのまま解釈する）
    python: "D:/vagrant/harnesses/super-agent/.cve-venv/Scripts/python.exe"
  probe:            # 起動時セルフチェック。ここが落ちたら全タスクを止める
    - ["D:/vagrant/harnesses/super-agent/.cve-venv/Scripts/python.exe", "-c", "import sys; print(sys.version)"]
    - ["git", "--version"]
